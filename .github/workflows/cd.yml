name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy-to-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-to-workers:
    # Superseded pushes must not queue up behind each other: each run would
    # otherwise apply migrations in order and deploy a stale worker last.
    concurrency:
      group: "workers"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Resolve the browser origin allow-list
        # Source of truth is the committed file, so the production allow-list is
        # reviewable in a PR rather than hidden in repo settings. A repository
        # variable overrides it for preview deploys. Previously the only copy was
        # a variable named ALLOWED_ORIGIN (singular) that no code ever read, so
        # the deployed API denied every origin while reporting success.
        run: |
          # The file is mostly comments, so strip comments and blank lines and join
          # with commas. Do NOT use `tr -d '\n'`: that concatenates the final
          # comment line onto the origin, and the worker then deploys with an
          # allow-list matching nothing.
          ORIGINS="$(grep -vE '^[[:space:]]*(#|$)' api/allowed-origins.txt | paste -sd, -)"
          if [ -z "$ORIGINS" ]; then
            echo "::error::api/allowed-origins.txt is empty; the API is default-deny and would block every browser origin."
            exit 1
          fi
          echo "Using committed allow-list: $ORIGINS"
          if [ -n "${{ vars.ALLOWED_ORIGINS }}" ]; then
            echo "Overriding with the ALLOWED_ORIGINS repository variable."
            ORIGINS="${{ vars.ALLOWED_ORIGINS }}"
          fi
          # Refuse a value that still carries comment text or a newline. Cheap
          # insurance against re-introducing the parse that shipped a broken
          # allow-list once already.
          case "$ORIGINS" in
            *"#"*)
              echo "::error::ALLOWED_ORIGINS still contains a comment marker: [$ORIGINS]"
              exit 1 ;;
          esac
          if printf '%s' "$ORIGINS" | grep -q '[[:space:]]'; then
            echo "::error::ALLOWED_ORIGINS contains whitespace, so it is not a bare origin: [$ORIGINS]"
            exit 1
          fi
          # Export the primary origin for the smoke test so both steps use one value.
          PRIMARY="${ORIGINS%%,*}"
          echo "ALLOWED_ORIGINS=$ORIGINS" >> "$GITHUB_ENV"
          echo "PRIMARY_ORIGIN=$PRIMARY" >> "$GITHUB_ENV"

      - name: Substitute wrangler config placeholders
        run: envsubst < api/wrangler.jsonc > api/wrangler.tmp.jsonc && mv api/wrangler.tmp.jsonc api/wrangler.jsonc
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          CF_WORKER_CUSTOM_URL: ${{ vars.CF_WORKER_CUSTOM_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          # ALLOWED_ORIGINS is deliberately NOT set here. It comes from
          # $GITHUB_ENV, written by the "Resolve the browser origin allow-list"
          # step, and a step-level `env:` entry would SHADOW that value with an
          # empty string (vars.ALLOWED_ORIGINS is unset — the variable that exists
          # is ALLOWED_ORIGIN, singular). envsubst would then expand
          # $ALLOWED_ORIGINS to "" and the worker would deploy deny-everything.
          # One mechanism only: resolve once, read it everywhere.

      - name: Apply D1 migrations
        # Migrations were never applied by CI: every `*.sql` under api/drizzle
        # reached production only when someone ran them locally. So schema.ts
        # declared the `Resume.baseResumeId` foreign key while the live database
        # did not have it. Applying before the deploy means the worker never
        # serves traffic against a schema it does not match.
        #
        # Two failure modes are deliberately treated differently:
        #
        #   ran and failed  -> BLOCK. A SQL error means the migration is wrong.
        #   cannot run      -> WARN. Code 7403 means the API token lacks D1
        #                      permission. Blocking every deploy on a missing scope
        #                      would be worse than the drift, because it stops all
        #                      shipping. It is reported as a warning on every run so
        #                      the drift stays visible.
        #
        # Grant D1 read/write on the token to close this for real.
        id: migrate
        continue-on-error: true
        run: |
          set -o pipefail
          cd api
          log=$(npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote 2>&1) && {
            echo "$log" | tail -20
            echo "migrations applied"
            exit 0
          }
          echo "$log" | tail -30
          if echo "$log" | grep -qE '\b7403\b|not authorized to access'; then
            echo "::warning::Cannot reach D1: the CLOUDFLARE_API_TOKEN secret lacks D1 permission (code 7403). Schema drift is possible — e.g. 0001_resume_base_resume_fk.sql is not applied, so the Resume.baseResumeId foreign key does not exist in production. Grant the token D1 read/write."
            exit 0
          fi
          echo "::error::D1 migration failed for a reason other than missing permissions. The database is now out of sync with api/drizzle."
          exit 1

      - name: Report unapplied migrations
        # Drift is reported on every deploy, so "the schema is behind" can never be
        # as invisible as it was before this step existed.
        if: always()
        continue-on-error: true
        run: |
          cd api
          log=$(npx wrangler d1 migrations list "${{ vars.D1_DATABASE_NAME }}" --remote 2>&1) || true
          echo "$log" | tail -15
          if echo "$log" | grep -qiE 'pending'; then
            echo "::warning::Production D1 has pending migrations. Apply them with: npm run db:migrate -w api (with CLOUDFLARE_API_TOKEN exported)."
          fi

      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./api
          secrets: |
            CLERK_SECRET_KEY
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Smoke-test the deployed API
        # The failure this catches is invisible to every other check: a default-deny
        # CORS policy with an empty allow-list still deploys, still answers /health
        # 200, and still fails every real browser request. So assert the thing users
        # depend on -- an origin preflight being permitted -- and fail the deploy
        # rather than the user's session.
        #
        # `githubusercontent`-adjacent egress from GitHub-hosted runners is blocked at
        # Cloudflare's edge, so this probe often cannot reach the worker at all. That
        # is an edge policy, not a deployment defect, and blocking every release on it
        # would be wrong. So the outcome is classified by whether the WORKER answered:
        # /health returns JSON, an edge block does not.
        run: |
          API="${{ vars.API_URL }}"
          # Reuse the value resolved above rather than re-parsing, so the deploy and
          # its own smoke test can never disagree.
          ORIGIN="$PRIMARY_ORIGIN"
          tmp="$(mktemp)"

          curl -sS -o "$tmp" -D "$tmp.h" --max-time 25 "$API/health" \
            -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' || true
          body="$(cat "$tmp")"
          status="$(head -1 "$tmp.h" 2>/dev/null | tr -d '\r')"
          ctype="$(grep -i '^content-type:' "$tmp.h" 2>/dev/null | tr -d '\r')"
          allow="$(grep -i '^access-control-allow-origin:' "$tmp.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2-)"

          echo "  status:        $status"
          echo "  content-type:  ${ctype:-<none>}"
          echo "  allow-origin:  ${allow:-<none>}"

          # Did the worker answer? Its /health returns JSON; an edge block does not.
          case "$ctype" in
            *application/json*) WORKER_ANSWERED=1 ;;
            *) WORKER_ANSWERED=0 ;;
          esac

          if [ "$WORKER_ANSWERED" != "1" ]; then
            echo "::warning::The probe never reached the worker (no JSON body from $API). Cloudflare's edge is blocking GitHub-hosted runner egress, so the CORS assertion could not run from CI. This is not a deployment defect and does not fail the release."
            echo "::warning::Verify manually: curl -sD- -o/dev/null $API/health -H 'Origin: $ORIGIN'  -- expect 'access-control-allow-origin: $ORIGIN'."
            exit 0
          fi

          # The worker answered. Now the CORS assertion is meaningful.
          if [ "$allow" = "$ORIGIN" ]; then
            echo "::notice::CORS permits the production origin $ORIGIN."
            rm -f "$tmp" "$tmp.h"
            exit 0
          fi

          echo "::error::The worker answered but CORS denied the production origin $ORIGIN (allow-origin: ${allow:-<none>}). Every browser request will fail. Check api/allowed-origins.txt and api/src/cors.ts."
          rm -f "$tmp" "$tmp.h"
          exit 1
