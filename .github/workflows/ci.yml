name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Typecheck gate. The build sets `typescript.ignoreBuildErrors: true`, so
  # without this job nothing type-checks in CI and type errors only surface
  # locally. Run for both workspaces (frontend + api) on Node 22.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck api
        run: npm run typecheck -w api

  test-api:
    # The api workspace had no test runner at all (docs/AGENT-CONTEXT.md 4).
    # These tests are the only automated guard on the tenant/ownership predicates
    # in section.ts, resume.ts and the ownership middleware, and on the CORS and
    # error-redaction behaviour in src/cors.ts and src/trpc/index.ts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Test api
        run: npm run test -w api

  test:
    # Root workspace: serialiser, and anything else that is pure logic under
    # `src/`. The Typst serialiser tests are the guard against a section type
    # regressing to exporting empty — `personal-info` and `custom` both shipped
    # that way, and the seeded demo resume demonstrated it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Test root workspace
        run: npm run test:root

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

  dev-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Start dev server and verify startup
        timeout-minutes: 2
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: |
          npm run dev:frontend &
          DEV_PID=$!
          echo "Dev server PID: $DEV_PID"

          # Poll until the dev server responds or timeout.
          # Use -s without -f so any HTTP response (even 4xx/5xx) counts as
          # "server is listening" — we only want to confirm startup, not that
          # every page renders without error.
          for i in $(seq 1 30); do
            # Fail fast if the dev server process has already exited
            if ! ps -p $DEV_PID > /dev/null 2>&1; then
              echo "Dev server process exited unexpectedly"
              exit 1
            fi
            if curl -s -o /dev/null --max-time 2 http://localhost:3000; then
              echo "Dev server is up and responding on port 3000"
              kill -TERM $DEV_PID 2>/dev/null || true
              exit 0
            fi
            echo "Waiting for dev server... attempt $i/30"
            sleep 3
          done

          echo "Dev server failed to start within timeout"
          kill -TERM $DEV_PID 2>/dev/null || kill -9 $DEV_PID 2>/dev/null || true
          exit 1
