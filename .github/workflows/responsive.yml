name: Responsive

# The viewport matrix: seven real viewports, measured in Chrome.
#
# Why this is its own workflow
#   It needs the whole stack — a seeded local D1, `wrangler dev`, and `next dev` with
#   the dev auth bypass on. The unit suite is deliberately Node-only (see
#   `vitest.config.mts`) and must stay runnable with `npx vitest run` and nothing else,
#   so the browser matrix is gated behind `RESPONSIVE_MATRIX=1` rather than skipping
#   silently inside the main `test` job.
#
# Why it is not advisory
#   `body { overflow-x: hidden }` is what let two header overflows ship. Every
#   assertion in `test/responsive-matrix.test.ts` measures geometry instead: element
#   rects, `scrollWidth` vs `clientWidth`, target sizes, the document page's aspect
#   ratio. If a layout stops fitting, this job says so.
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/responsive-*"
      - "scripts/probe/**"
      - "api/src/db/seed.sql"
      - ".github/workflows/responsive.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: responsive-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build:types

      - name: Install the Typst compiler
        # The matrix itself measures geometry in Chrome and does not invoke the CLI. It is
        # installed anyway so this job carries the same toolchain as `test`: the suite's
        # Typst gates now fail (rather than skip) without it, and a probe added here later
        # must not be the one place a compiler can be missing and nobody notices.
        # Pinned to the 0.14 line `@myriaddreamin/typst.ts` 0.7.0 wraps; see
        # `test/helpers/typst-cli.ts` and docs/AGENT-CONTEXT.md §2.27.
        run: |
          curl -fsSL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d  /tmp/typst.tar.xz" \
            | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install Playwright without touching the lockfile
        # Same reasoning as visual.yml: browser automation is not needed to build or
        # ship, and adding it to package.json invites resolver churn.
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0

      - name: Install Chromium as a fallback for the Chrome channel
        # The matrix launches `channel: "chrome"` because that is what this project's
        # probe scripts use; the bundled build is the fallback when the channel is
        # missing. Installing it costs ~40s and removes a class of "works on my
        # machine" failure.
        run: npx playwright install --with-deps chromium

      - name: Copy the Typst WASM modules into public/
        # `public/wasm/` is gitignored and generated by `prebuild` / `predev`. This job
        # starts `next dev` directly rather than through `npm run dev`, so it has to run
        # the copy itself — without it the preview never compiles and the matrix waits
        # for a page box that cannot appear.
        run: npm run copy:typst

      - name: Seed the local D1
        # `db:reset-seed` applies every migration and loads `seed.sql`, which is what
        # puts `resume-1` and `user-1` behind the dev auth bypass.
        run: npm run db:reset-seed

      - name: Start the API and the app
        run: |
          # The Worker reads its Clerk keys from `.dev.vars` (gitignored). Placeholder
          # values are enough: the dev bypass short-circuits token verification, and
          # the client is only constructed, never called.
          cat > api/.dev.vars <<EOF
          CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-pk_test_cGxhY2Vob2xkZXIuY2xlcmsuZXhhbXBsZS5jb20k}
          CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-sk_test_cGxhY2Vob2xkZXI=}
          EOF

          (cd api && npx wrangler dev --config wrangler.dev.jsonc --port 4100 > /tmp/api.log 2>&1 &)

          NEXT_PUBLIC_API_URL=http://localhost:4100 \
          NEXT_PUBLIC_DEV_MODE=true \
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${CLERK_PUBLISHABLE_KEY:-pk_test_cGxhY2Vob2xkZXIuY2xlcmsuZXhhbXBsZS5jb20k}" \
          npx next dev --webpack --port 3000 > /tmp/web.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:4100/health > /dev/null \
               && curl -sf --max-time 2 http://localhost:3000/ > /dev/null; then
              echo "stack up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the stack did not come up in 120s"
          echo "=== api.log ==="
          tail -50 /tmp/api.log
          echo "=== web.log ==="
          tail -50 /tmp/web.log
          exit 1

      - name: Run the viewport matrix
        run: npx vitest run test/responsive-matrix.test.ts
        env:
          RESPONSIVE_MATRIX: "1"
          PROBE_BASE: http://localhost:3000
          PROBE_RESUME: resume-1

      - name: Upload the dev-server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          retention-days: 14
          if-no-files-found: ignore
